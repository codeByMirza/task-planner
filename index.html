
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">
        <header class="header">
            <div>
                <p class="eyebrow">PRODUCTIVITY WORKSPACE</p>
                <h1>Task Planner</h1>
                <p class="subtitle">Organize your tasks. Stay productive.</p>
            </div>
            <div class="header-icon">✓</div>
        </header>

        <section class="planner">
            <form id="taskForm" class="task-form">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs to be done?"
                    maxlength="150"
                    autocomplete="off"
                    aria-label="New task"
                >
                <button type="submit">Add Task <span>+</span></button>
            </form>

            <p id="errorMessage" class="error-message" role="alert"></p>

            <div class="task-toolbar">
                <h2>My Tasks</h2>
                <nav class="filters" aria-label="Filter tasks">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </nav>
            </div>

            <div id="taskList" class="task-list"></div>

            <footer class="footer">
                <span id="taskCount">0 tasks remaining</span>
                <span>Saved automatically</span>
            </footer>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
